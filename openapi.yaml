openapi: 3.0.3
info:
  title: Brewfolio API
  version: 0.1.0
  description: API spec for coffee beans and brew records. Field semantics are defined in docs/data-dictionary.md.
servers:
  - url: http://localhost:3001
    description: Local development server
tags:
  - name: Brews
    description: Coffee brew records
  - name: Beans
    description: Coffee bean catalog
  - name: Drippers
    description: Personal coffee dripper catalog
paths:
  /api/brews:
    get:
      tags:
        - Brews
      summary: List brew records
      description: Returns brew records ordered by brew time, newest first.
      operationId: listBrews
      responses:
        '200':
          description: Brew record summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BrewSummary'
              examples:
                default:
                  value:
                    - id: 12
                      brewed_at: '2026-09-12T08:30:00.000Z'
                      H_I: H
                      starred: 1
                      notes: First try with higher water temperature.
                      beans_display: Panama Geisha Washed Light
                      dripper_id: 2
                      dripper_name: Hario Switch
                      dripper_material: Ceramic
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Brews]
      summary: Create a brew and pour records atomically
      description: >-
        Optional numeric values may be null. Provided bean, dripper and source brew IDs must exist.
        Finished beans may be used for retrospective records. Volume mismatches
        produce warnings without rejecting the record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brew]
              properties:
                brew:
                  $ref: '#/components/schemas/BrewInput'
                pours:
                  type: array
                  maxItems: 128
                  items:
                    $ref: '#/components/schemas/PourInput'
      responses:
        '200':
          description: Created brew ID and non-blocking warnings.
          content:
            application/json:
              schema:
                type: object
                required: [id, warnings]
                properties:
                  id:
                    type: integer
                  warnings:
                    type: array
                    items:
                      type: string
        '400':
          description: Invalid fields or missing related bean, dripper or source brew.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/brews/{id}:
    get:
      tags:
        - Brews
      summary: Get one brew record
      description: Returns one brew record with its pour steps.
      operationId: getBrew
      parameters:
        - $ref: '#/components/parameters/BrewId'
      responses:
        '200':
          description: A brew record with pour details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrewDetail'
              examples:
                default:
                  value:
                    id: 12
                    brewed_at: '2026-09-12T08:30:00.000Z'
                    bean_id: 3
                    source_brew_id: null
                    dripper_id: 2
                    dripper_name: Hario Switch
                    dripper_material: Ceramic
                    beans_name: Panama Geisha
                    process: Washed
                    roast_level: Light
                    beans_display: Panama Geisha Washed Light
                    grind: 4
                    H_I: H
                    bean_weight: 25
                    water_vol: 450
                    water_temp: 94
                    ice_vol: 0
                    sour: 3
                    sweet: 4
                    bitter: 1
                    richness: 4
                    aroma: 5
                    notes: Higher water temperature, coarser grind, high brew ratio.
                    starred: 1
                    pours:
                      - id: 21
                        brew_id: 12
                        pour_order: 0
                        volume_ml: 90
                        duration_s: 15
                        wait_s: 25
                      - id: 22
                        brew_id: 12
                        pour_order: 1
                        volume_ml: 225
                        duration_s: 30
                        wait_s: 30
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/beans:
    get:
      tags:
        - Beans
      summary: List coffee beans
      description: Returns all saved coffee beans ordered by bean name.
      operationId: listBeans
      responses:
        '200':
          description: Coffee bean catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bean'
              examples:
                default:
                  value:
                    - id: 3
                      beans_name: Panama Geisha
                      process: Washed
                      roast_level: Light
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/beans/{id}/finished:
    patch:
      tags: [Beans]
      summary: Mark a bean as finished or available
      description: Changes current availability without removing historical records.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_finished]
              properties:
                is_finished:
                  oneOf:
                    - type: boolean
                    - type: integer
                      enum: [0, 1]
      responses:
        '200':
          description: Availability updated.
          content:
            application/json:
              schema:
                type: object
                required: [ok, is_finished]
                properties:
                  ok:
                    type: boolean
                  is_finished:
                    type: integer
                    enum: [0, 1]
        '400':
          description: Invalid ID or status.
        '404':
          description: Bean not found.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/drippers:
    get:
      tags: [Drippers]
      summary: List saved drippers
      responses:
        '200':
          description: Drippers ordered by name and material.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Dripper' }
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Drippers]
      summary: Save a dripper
      requestBody:
        $ref: '#/components/requestBodies/Dripper'
      responses:
        '201':
          $ref: '#/components/responses/Dripper'
        '400':
          description: Invalid name or material.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/drippers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1, maximum: 2147483647 }
    put:
      tags: [Drippers]
      summary: Update a saved dripper
      requestBody:
        $ref: '#/components/requestBodies/Dripper'
      responses:
        '200':
          $ref: '#/components/responses/Dripper'
        '400':
          description: Invalid ID, name or material.
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Drippers]
      summary: Delete an unused dripper
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          description: Invalid dripper ID.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The dripper is linked to at least one brew.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/brews/{id}/dripper:
    patch:
      tags: [Brews]
      summary: Update or clear a brew's dripper
      parameters:
        - $ref: '#/components/parameters/BrewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dripper_id]
              properties:
                dripper_id: { type: integer, nullable: true, minimum: 1, maximum: 2147483647 }
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          description: Invalid ID or unknown dripper.
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  requestBodies:
    Dripper:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DripperInput'
  parameters:
    BrewId:
      name: id
      in: path
      required: true
      description: Brew record ID.
      schema:
        type: integer
        minimum: 1
      example: 12
  responses:
    Ok:
      description: Update succeeded.
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties:
              ok: { type: boolean }
    Dripper:
      description: Saved dripper.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Dripper'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Not found
    InternalServerError:
      description: Unexpected server or database error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Database connection failed
  schemas:
    DripperInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        material: { type: string, nullable: true, maxLength: 50 }
    Dripper:
      allOf:
        - $ref: '#/components/schemas/DripperInput'
        - type: object
          required: [id, material]
          properties:
            id: { type: integer, minimum: 1 }
    Bean:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          example: 3
        beans_name:
          type: string
          nullable: true
          example: Panama Geisha
        process:
          type: string
          nullable: true
          example: Washed
        roast_level:
          type: string
          nullable: true
          example: Light
        is_finished:
          type: integer
          enum: [0, 1]
          description: 1 means marked finished; 0 means not marked finished, not a verified stock count.
      required:
        - id
        - beans_name
        - process
        - roast_level
        - is_finished
    BrewSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          example: 12
        brewed_at:
          type: string
          format: date-time
          example: '2026-09-12T08:30:00.000Z'
        H_I:
          $ref: '#/components/schemas/BrewMethod'
        starred:
          description: Explicit preference when 1; 0 means unmarked, not disliked.
          type: integer
          enum:
            - 0
            - 1
          example: 1
        notes:
          type: string
          nullable: true
          example: First try with higher water temperature.
        beans_display:
          type: string
          example: Panama Geisha Washed Light
        dripper_id: { type: integer, nullable: true }
        dripper_name: { type: string, nullable: true }
        dripper_material: { type: string, nullable: true }
      required:
        - id
        - brewed_at
        - H_I
        - starred
        - notes
        - beans_display
        - dripper_id
        - dripper_name
        - dripper_material
    BrewDetail:
      allOf:
        - $ref: '#/components/schemas/BrewBase'
        - type: object
          additionalProperties: false
          properties:
            pours:
              type: array
              items:
                $ref: '#/components/schemas/Pour'
          required:
            - pours
    BrewBase:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          example: 12
        brewed_at:
          type: string
          format: date-time
          example: '2026-09-12T08:30:00.000Z'
        bean_id:
          type: integer
          nullable: true
          example: 3
        source_brew_id:
          type: integer
          nullable: true
          example: null
        dripper_id: { type: integer, nullable: true }
        dripper_name: { type: string, nullable: true }
        dripper_material: { type: string, nullable: true }
        beans_name:
          type: string
          nullable: true
          example: Panama Geisha
        process:
          type: string
          nullable: true
          example: Washed
        roast_level:
          type: string
          nullable: true
          example: Light
        beans_display:
          type: string
          nullable: true
          example: Panama Geisha Washed Light
        grind:
          description: Personal raw grinder setting; direction, device and calibration are unknown. Zero is valid.
          minimum: 0
          type: number
          nullable: true
          example: 4
        H_I:
          $ref: '#/components/schemas/BrewMethod'
        bean_weight:
          type: number
          nullable: true
          example: 25
        water_vol:
          description: Poured water in ml, excluding ice.
          minimum: 1
          type: integer
          nullable: true
          example: 450
        water_temp:
          type: integer
          nullable: true
          example: 94
        ice_vol:
          description: Ice weight in grams, separate from water_vol. Future AI field name is ice_weight_g.
          minimum: 0
          type: integer
          nullable: true
          example: 0
        sour:
          $ref: '#/components/schemas/Rating'
        sweet:
          $ref: '#/components/schemas/Rating'
        bitter:
          $ref: '#/components/schemas/Rating'
        richness:
          $ref: '#/components/schemas/Rating'
        aroma:
          $ref: '#/components/schemas/Rating'
        notes:
          type: string
          nullable: true
          example: Higher water temperature, coarser grind, high brew ratio.
        starred:
          description: Explicit preference when 1; 0 means unmarked, not disliked.
          type: integer
          enum:
            - 0
            - 1
          example: 1
      required:
        - id
        - brewed_at
        - bean_id
        - source_brew_id
        - dripper_id
        - dripper_name
        - dripper_material
        - beans_name
        - process
        - roast_level
        - beans_display
        - grind
        - H_I
        - bean_weight
        - water_vol
        - water_temp
        - ice_vol
        - sour
        - sweet
        - bitter
        - richness
        - aroma
        - notes
        - starred
    BrewInput:
      type: object
      required: [H_I]
      properties:
        bean_id:
          type: integer
          nullable: true
          minimum: 1
          maximum: 2147483647
        source_brew_id:
          type: integer
          nullable: true
          minimum: 1
          maximum: 2147483647
        dripper_id: { type: integer, nullable: true, minimum: 1, maximum: 2147483647 }
        H_I:
          $ref: '#/components/schemas/BrewMethod'
        bean_weight:
          type: number
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          maximum: 3.4028234663852886e38
          description: Coffee weight in grams.
        grind:
          type: number
          nullable: true
          minimum: 0
          maximum: 3.4028234663852886e38
          description: Personal raw setting, with no universal coarse/fine direction.
        water_vol:
          type: integer
          nullable: true
          minimum: 1
          maximum: 2147483647
          description: Poured water in ml, excluding ice.
        water_temp:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100
        ice_vol:
          type: integer
          nullable: true
          minimum: 0
          maximum: 2147483647
          description: Ice weight in grams; future AI name is ice_weight_g.
        sour:
          $ref: '#/components/schemas/Rating'
        sweet:
          $ref: '#/components/schemas/Rating'
        bitter:
          $ref: '#/components/schemas/Rating'
        richness:
          $ref: '#/components/schemas/Rating'
        aroma:
          $ref: '#/components/schemas/Rating'
        notes:
          type: string
          nullable: true
          description: Original observations; maximum 65535 UTF-8 bytes.
    PourInput:
      type: object
      required: [pour_order]
      description: Order must be unique within a brew. Partial records are allowed.
      properties:
        pour_order:
          type: integer
          minimum: 0
          maximum: 127
        volume_ml:
          type: integer
          nullable: true
          minimum: 0
          maximum: 2147483647
          description: Water poured in this step, not a cumulative total.
        duration_s:
          type: integer
          nullable: true
          minimum: 0
          maximum: 2147483647
        wait_s:
          type: integer
          nullable: true
          minimum: 0
          maximum: 2147483647
    BrewMethod:
      type: string
      enum:
        - H
        - I
      description: H means hot brew; I means iced brew.
      example: H
    Rating:
      description: Subjective sensory intensity, not quality or preference. Null means not rated.
      type: integer
      nullable: true
      minimum: 1
      maximum: 5
      example: 4
    Pour:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          example: 21
        brew_id:
          type: integer
          example: 12
        pour_order:
          type: integer
          minimum: 0
          example: 0
        volume_ml:
          type: integer
          nullable: true
          example: 90
        duration_s:
          type: integer
          nullable: true
          example: 15
        wait_s:
          type: integer
          nullable: true
          example: 25
      required:
        - id
        - brew_id
        - pour_order
        - volume_ml
        - duration_s
        - wait_s
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
          example: Not found
      required:
        - error
